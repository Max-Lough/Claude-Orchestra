name: tests

# Why this exists, and why it is this small:
#
# Every field failure the cross-vendor review lane has produced happened on
# WINDOWS — and the suite that is supposed to catch them used to exit 0 there
# even when cases failed, so a broken suite looked green through two rounds of
# real failures. No session working on this repo has a Windows machine. A
# windows-latest runner is the only thing that closes that gap.
#
# Everything else is deliberately absent. There is no build, no bundle, and no
# publish step: the harness is distributed by `git pull` + `node install.js`, so
# there is nothing to deploy. There is no linter or formatter job either — this
# repository has zero dependencies and no package.json, and importing a
# toolchain larger than the project it guards would cost more than it catches.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-lanes:
    name: codex lanes · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One platform's failure must never hide another's — the whole point of
      # the matrix is to see WHICH platforms disagree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Identify the environment under test
        shell: bash
        run: |
          node --version
          git --version

      - name: Give git an identity (the suite builds fixture repositories)
        shell: bash
        run: |
          git config --global user.email "orchestra-ci@users.noreply.github.com"
          git config --global user.name "Orchestra CI"
          git config --global init.defaultBranch main

      - name: Frontmatter lint (whole repository)
        # A YAML-unsafe frontmatter value makes Claude Code drop the file
        # SILENTLY — the agent never registers, with no log anywhere. Strict:
        # warnings (values that parse but lean on the CRLF-fragile repair
        # pass) fail this step too, so the class can never merge again.
        run: node install.js --lint

      - name: Frontmatter-lint suite
        # Exercises the linter against the unparseable class, the installer's
        # refusal to stamp a failing source, LF normalization of installed
        # markdown, the stamped .claude/.gitattributes, and the stamped
        # .claude/hooks/package.json that keeps hook scripts CommonJS under a
        # "type": "module" target.
        run: node tests/frontmatter-lint.test.js

      - name: Review-lane suite
        # The suite drives the real runner against a stub Codex and asserts on
        # what the engine was handed. It needs no install step: plain node, plain
        # git, no dependencies.
        run: node tests/review-lane.test.js

      - name: Scan-lane suite
        # Exercises install.js --scan / --update against real installs the
        # installer itself produced, then aged. Nothing is stubbed: the point
        # is that the scan reads what the installer actually writes.
        run: node tests/scan-lane.test.js

      - name: Exec-lane suite
        # Same shape for the execution runner: the stub reports what the engine
        # saw (model, sandbox, effort, identity, brief markers), and the suite
        # asserts on settings resolution, the tree audit, and the no-retry law.
        run: node tests/exec-lane.test.js

      - name: Registry suite
        # WO-4: the class registry, six schemas, and the mechanical ownership
        # invariant — plus tamper tests proving each corruption fails the
        # load. (Added alongside the verifier suite; the step was missed when
        # WO-4 landed.)
        run: node tests/registry.test.js

      - name: Verifier suite
        # WO-5: the deterministic Verifier substrate. Builds a fixture
        # project whose suite cannot run read-only, then proves the
        # disposable-checkout substrate catches a red suite reported green,
        # changes claimed against an untouched tree, an invertible test that
        # stays green, and a broken row-count invariant.
        run: node tests/verifier.test.js

      - name: Router suite
        # WO-6: route/cast/reviewer, the pool-state degradation machine, the
        # pre-dispatch AU-O gate, and automatic Q0 creation. Proves
        # no-self-family for every author family, that no mandatory-class
        # dispatch can produce a same-family closing verdict under any bucket
        # state including Red/exhausted, context-shape rejection, every rung's
        # documented casting set, and Q0 spawn on every trigger.
        run: node tests/router.test.js

      - name: Ticket state machine suite
        # WO-14b leg 2a: the activation bridge's ticket lifecycle
        # (OPEN → CONSUMED → LAUNCHED → RESOLVED → CLOSED/NOT_CLOSED, plus
        # EXPIRED/INVALIDATED). Proves one-use consumption, wrong-role and
        # replay refusal, Q0-before-implementation ordering, generation-bump
        # invalidation (the rollback hook), atomic locked writes with no lost
        # update across two processes, and fail-closed on a corrupted store.
        run: node tests/tickets.test.js

      - name: Bridge suite (activation runtime)
        # WO-14b leg 4/4b: the shared activation runtime core
        # (dispatch/gate/requireTicket/generationCheck/doctor) and its
        # ticket-gate hook adapter. Proves the leg-1 payload lifecycle end to
        # end (dispatch -> Pre consume -> Post launch -> SubagentStop resolve
        # -> Stop not blocked), every Pre denial class, generation
        # invalidation, Q0-before-implementation ordering, DISABLED-seat
        # passthrough, and — leg 4b — the owner-pinned manifest: no pin
        # forces roster:legacy (inert gate) regardless of what the manifest
        # says, and a pin present with a manifest hash mismatch fails every
        # gate/dispatch/ticket decision closed rather than trusting a
        # tamperable in-project file (roster/wo14b-leg3-redteam-1.md's [HIGH]
        # finding).
        run: node tests/bridge.test.js

      - name: Quartermaster suite
        # WO-11: the P0 allowance substrate — recorded readings in, the
        # router's bucket_state out. Proves it fails CLOSED on absent, stale,
        # future-dated or malformed-latest evidence (never Green, never Red),
        # that staleness is disclosed rather than discounted, and — the
        # load-bearing part — that a P0-produced state drives the REAL router
        # end-to-end: Green dispatches, a below-reserve AU-opus reading fires
        # the P15 gate, an unconfirmed Amber fires the §5.5 arm, and a
        # hard-throttled bucket takes the exhaustion-matrix path.
        run: node tests/quartermaster.test.js

      - name: WO-7b misroute-recovery gates
        # Re-scores the committed WO-7b probe results through the live
        # router, so a router change that would break the pre-registered
        # G1/G2/G3 gates (recovery, no gate crossing, P95 hops) fails CI
        # instead of silently invalidating the probe. (Added on an S0
        # sweep finding — the same class of gap the registry suite had.)
        run: node plans/cross-compare/agent-role-architecture/wo7b/score.js

      - name: Roster contract lint
        # WO-8-11: every staffed roster file carries all nine Part-2.0
        # fields, its frontmatter matches the documented casting rung/lane,
        # and mirror-or-declared-exception holds (plus the installer's
        # frontmatter lint over the same files).
        run: |
          node roster/lint.js
          node install.js --lint roster

      - name: MCP-lane suite
        # The orchestra-engine MCP server — the typed transport that replaced
        # the launcher shell pipeline. Speaks real JSON-RPC to the server over
        # stdio, drives the real runners against the stub engine underneath,
        # and asserts the server relays reports verbatim and speaks only in
        # MCP TRANSPORT terms when the transport itself fails.
        run: node tests/mcp-lane.test.js

      - name: WO-12 tooling suite
        # The seeded-defect-corpus (SDC) tooling: build-corpus.js's
        # reproducible variant materialization (same head sha from two
        # independent clones) and fail-closed patch handling, run-lane.js's
        # P0/OU Quartermaster gate and --yes/--dry-run refusals (stubbed
        # quartermaster, no real codex invocation), and score.js's mechanical
        # hit logic, Wilson intervals, and the 12d seed-level union table.
        run: node tests/wo12-tooling.test.js

      - name: Install suite (--roster legacy|new)
        # WO-14b leg 3: legacy census pinned unchanged; the new-roster file
        # census (agents, ORCHESTRA-CONDUCTOR.md, .claude/orchestra/
        # substrates, bridge/ handled silently whether or not it exists);
        # manifest keys (roster/seats/rosterGeneration) and generation-bump
        # on every flip; user keys preserved byte-for-byte in settings.json,
        # .mcp.json, and orchestra.json; malformed JSON and malformed
        # permissions refused before anything is touched; uninstall order
        # (settings validated first); default vs --grant-push grants incl.
        # the deny counterweight; installedPermissions tracking; --lint.
        run: node tests/install.test.js

      - name: Guard suite (orchestra-guard.js)
        # sdc-011/012: the .md + real-path plan-file containment fix
        # (symlink/junction escape denied), the deny hint naming every
        # configured plan directory, and the roster:new asymmetry — an
        # undetermined session model denies under roster:new and stands
        # down under legacy.
        run: node tests/guard.test.js
