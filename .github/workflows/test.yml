name: tests

# Why this exists, and why it is this small:
#
# Every field failure the cross-vendor review lane has produced happened on
# WINDOWS — and the suite that is supposed to catch them used to exit 0 there
# even when cases failed, so a broken suite looked green through two rounds of
# real failures. No session working on this repo has a Windows machine. A
# windows-latest runner is the only thing that closes that gap.
#
# Everything else is deliberately absent. There is no build, no bundle, and no
# publish step: the harness is distributed by `git pull` + `node install.js`, so
# there is nothing to deploy. There is no linter or formatter job either — this
# repository has zero dependencies and no package.json, and importing a
# toolchain larger than the project it guards would cost more than it catches.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-lanes:
    name: codex lanes · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One platform's failure must never hide another's — the whole point of
      # the matrix is to see WHICH platforms disagree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Identify the environment under test
        shell: bash
        run: |
          node --version
          git --version

      - name: Give git an identity (the suite builds fixture repositories)
        shell: bash
        run: |
          git config --global user.email "orchestra-ci@users.noreply.github.com"
          git config --global user.name "Orchestra CI"
          git config --global init.defaultBranch main

      - name: Review-lane suite
        # The suite drives the real runner against a stub Codex and asserts on
        # what the engine was handed. It needs no install step: plain node, plain
        # git, no dependencies.
        run: node tests/review-lane.test.js

      - name: Scan-lane suite
        # Exercises install.js --scan / --update against real installs the
        # installer itself produced, then aged. Nothing is stubbed: the point
        # is that the scan reads what the installer actually writes.
        run: node tests/scan-lane.test.js

      - name: Exec-lane suite
        # Same shape for the execution runner: the stub reports what the engine
        # saw (model, sandbox, effort, identity, brief markers), and the suite
        # asserts on settings resolution, the tree audit, and the no-retry law.
        run: node tests/exec-lane.test.js
