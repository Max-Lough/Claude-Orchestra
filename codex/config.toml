# Project defaults for the Codex-native Orchestra. Explicit per-session model
# choices in the app/CLI still take precedence over these defaults.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[features]
hooks = true
